<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | MS Enterprise</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: var(--darker-bg); }
        .admin-container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .login-box {
            width: 100%; max-width: 400px;
            text-align: center;
        }
        .login-box input {
            width: 100%; padding: 1rem;
            margin: 1.5rem 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 4px; color: #fff;
        }
        
        /* Sidebar */
        .admin-sidebar {
            width: 250px;
            background: var(--dark-bg);
            border-right: 1px solid var(--glass-border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }
        .admin-logo { margin-bottom: 3rem; }
        .admin-nav { flex-grow: 1; display: flex; flex-direction: column; gap: 1rem; }
        .admin-nav button {
            background: transparent; border: none; color: var(--text-muted);
            text-align: left; padding: 0.8rem; cursor: pointer; border-radius: 4px;
            display: flex; align-items: center; gap: 0.8rem; font-size: 1rem;
        }
        .admin-nav button:hover, .admin-nav button.active {
            background: rgba(14, 165, 233, 0.1); color: var(--primary);
        }
        
        /* Main Content */
        .admin-main {
            flex-grow: 1;
            padding: 3rem;
            height: 100vh;
            overflow-y: auto;
        }
        .header-actions {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 3rem;
        }
        
        /* Table */
        table {
            width: 100%; border-collapse: collapse;
            background: var(--card-bg); border-radius: 8px; overflow: hidden;
        }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--glass-border); }
        th { background: rgba(255,255,255,0.05); color: var(--primary); }
        tr:hover { background: rgba(255,255,255,0.02); }
        td img { width: 50px; height: 50px; object-fit: contain; background: #fff; border-radius: 4px; }
        .action-btns button {
            background: transparent; border: none; cursor: pointer; padding: 0.5rem;
            font-size: 1.1rem;
        }
        .btn-edit { color: var(--primary); }
        .btn-delete { color: #ef4444; }
        
        /* Product Form Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--dark-bg); width: 90%; max-width: 600px;
            padding: 2rem; border-radius: 8px; border: 1px solid var(--glass-border);
            max-height: 90vh; overflow-y: auto;
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border); border-radius: 4px; color: #fff;
        }
        .image-preview {
            width: 100px; height: 100px; margin-top: 1rem; border-radius: 4px;
            background: #fff; display: flex; align-items: center; justify-content: center;
        }
        .image-preview img { max-width: 100%; max-height: 100%; }
        
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box glass-card">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">MS <span>Enterprise</span></a>
            <p>Admin Dashboard Login</p>
            <input type="password" id="adminPassword" placeholder="Enter Password">
            <button class="btn btn-primary" style="width: 100%;" onclick="attemptLogin()">Login</button>
            <p id="loginError" style="color: #ef4444; margin-top: 1rem; display: none;">Incorrect password</p>
            <a href="index.html" style="display: block; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">&larr; Back to Website</a>
        </div>
    </div>

    <div class="admin-container" style="display: none;" id="adminDashboard">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <a href="index.html" class="logo">MS <span>Admin</span></a>
            </div>
            <nav class="admin-nav">
                <button class="active"><i class="fas fa-box"></i> Products</button>
                <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="header-actions">
                <div>
                    <h2>Products Management</h2>
                    <p style="color: var(--text-muted);" id="product-count">Total: 0</p>
                </div>
                <button class="btn btn-primary" onclick="openProductModal()"><i class="fas fa-plus"></i> Add Product</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Featured</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-products-table">
                    <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
                <h2 id="modalTitle">Add Product</h2>
                <button onclick="closeProductModal()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="productId">
                
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="pName" required>
                </div>
                
                <div class="form-group">
                    <label>Category *</label>
                    <select id="pCategory" required>
                        <!-- Populated via JS -->
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Price</label>
                    <input type="text" id="pPrice" placeholder="e.g. ₹5,000">
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="pDesc" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label>Features (comma separated)</label>
                    <input type="text" id="pFeatures" placeholder="e.g. 1080p, Night Vision, WiFi">
                </div>
                
                <div class="form-group" style="display: flex; align-items: center; gap: 1rem;">
                    <input type="checkbox" id="pFeatured" style="width: auto;">
                    <label for="pFeatured" style="margin: 0; color: #fff;">Show on Home Page (Featured)</label>
                </div>

                <div class="form-group">
                    <label>Product Image</label>
                    <input type="file" id="pImage" accept="image/*" onchange="previewImage(event)">
                    <input type="hidden" id="pExistingImage">
                    <div class="image-preview" id="imgPreviewContainer" style="display: none;">
                        <img id="imgPreview" src="">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="closeProductModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
